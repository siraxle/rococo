plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.cloud.tools.jib' version '3.4.1'
}

group = 'guru.qa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.grpc:spring-grpc-dependencies:0.3.0'
    }
}

dependencies {
    // Общий модуль с proto
    implementation project(':rococo-grpc-common')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'org.flywaydb:flyway-core:10.17.1'
    implementation 'org.flywaydb:flyway-mysql:10.17.1'

    // gRPC
    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter'
    implementation 'io.grpc:grpc-services'
    implementation 'io.grpc:grpc-netty-shaded'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

jib {
    container {
        ports = ['8097', '8095']
        jvmFlags = ["-Dspring.profiles.active=${System.env.PROFILE ?: 'docker'}", "-Djava.net.preferIPv4Stack=true"]
        environment = [
                'TZ': 'Europe/Moscow',
                'SPRING_DATASOURCE_URL': 'jdbc:mysql://rococo-all-db:3306/rococo-geo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true',
                'SPRING_DATASOURCE_USERNAME': 'root',
                'SPRING_DATASOURCE_PASSWORD': 'secret'
        ]
        creationTime = 'USE_CURRENT_TIMESTAMP'
        labels = ['maintainer': 'siraxle', 'version': "${project.version}"]
    }
    from {
        image = project.findProperty('dockerImage') ?: 'eclipse-temurin:21-jdk'
    }
    to {
        image = "${project.findProperty('dockerHubName') ?: 'siraxle'}/${project.name}-docker"
        tags = ['latest', "${project.version}"]
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.jibDockerBuild.dependsOn test

tasks.register('prepareKotlinBuildScriptModel') {
    description = "Dummy task to satisfy IntelliJ IDEA sync"
}