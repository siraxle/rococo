<h5>Sql Query</h5>
<div>
    <pre>
        <code>
            SELECT
  HEX(id) as id,
  title,
  description,
  photo,
  HEX(artist_id) as artist_id,
  HEX(museum_id) as museum_id
FROM
  painting
WHERE
  HEX(id) = '692C6DC9738F4A9797D09361F332E0BD'
        </code>
    </pre>
