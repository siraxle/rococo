name: Full Tests with All Microservices

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -psecret --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create all databases
        run: |
          mysql -h127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS rococo_auth;"
          mysql -h127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS rococo_userdata;"
          mysql -h127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS rococo_artist;"
          mysql -h127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS rococo_museum;"
          mysql -h127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS rococo_painting;"
          mysql -h127.0.0.1 -uroot -psecret -e "CREATE DATABASE IF NOT EXISTS rococo_geo;"

      - name: Build all jars
        run: |
          ./gradlew :rococo-auth:bootJar
          ./gradlew :rococo-userdata:bootJar
          ./gradlew :rococo-artist:bootJar
          ./gradlew :rococo-museum:bootJar
          ./gradlew :rococo-painting:bootJar
          ./gradlew :rococo-geo:bootJar
          ./gradlew :rococo-gateway:bootJar

      - name: Start Auth
        run: |
          java -jar rococo-auth/build/libs/rococo-auth-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,auth &
          sleep 15

      - name: Start Userdata
        run: |
          java -jar rococo-userdata/build/libs/rococo-userdata-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,userdata &
          sleep 15

      - name: Start Artist
        run: |
          java -jar rococo-artist/build/libs/rococo-artist-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,artist &
          sleep 10

      - name: Start Museum
        run: |
          java -jar rococo-museum/build/libs/rococo-museum-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,museum &
          sleep 10

      - name: Start Painting
        run: |
          java -jar rococo-painting/build/libs/rococo-painting-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,painting &
          sleep 10

      - name: Start Geo
        run: |
          java -jar rococo-geo/build/libs/rococo-geo-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,geo &
          sleep 10

      - name: Start Gateway
        run: |
          java -jar rococo-gateway/build/libs/rococo-gateway-*.jar --spring.config.location=file:./application-ci.yml --spring.profiles.active=ci,gateway &
          sleep 15

      - name: Run tests
        run: ./gradlew :rococo-tests:test

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Full Test Report
          path: rococo-tests/build/test-results/test/*.xml
          reporter: java-junit