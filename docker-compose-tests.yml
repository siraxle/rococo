services:
  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    ports:
      - "4444:4444"
    environment:
      - TZ=Europe/Moscow
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/config:/etc/selenoid
      - ./selenoid/video:/opt/selenoid/video
      - ./selenoid/logs:/opt/selenoid/logs
    command: ["-conf", "/etc/selenoid/browsers.json", "-video-output-dir", "/opt/selenoid/video", "-log-output-dir", "/opt/selenoid/logs", "-limit", "4", "-container-network", "rococo-master_rococo-network"]
    networks:
      - rococo-master_rococo-network
    restart: unless-stopped

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    ports:
      - "8080:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    networks:
      - rococo-master_rococo-network
    depends_on:
      - selenoid
    restart: unless-stopped

  allure:
    image: frankescobar/allure-docker-service:latest
    container_name: allure
    ports:
      - "5050:5050"
    environment:
      - TZ=Europe/Moscow
      - ALLURE_DOCKER_PUBLIC_API=http://allure:5050
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-reports:/app/default-reports
    networks:
      - rococo-master_rococo-network
    restart: unless-stopped

  rococo-tests:
    build:
      context: ./
      dockerfile: ./rococo-tests/Dockerfile
    container_name: rococo-tests
    environment:
      - PROFILE=docker
      - ALLURE_DOCKER_API=http://allure:5050
      - SELENOID_URL=http://selenoid:4444/wd/hub
    networks:
      - rococo-master_rococo-network
    depends_on:
      - selenoid
      - allure
    volumes:
      - ./allure-results:/app/rococo-tests/build/allure-results
    command: ./gradlew :rococo-tests:test -Dtest.env=docker --no-daemon

networks:
  rococo-master_rococo-network:
    external: true